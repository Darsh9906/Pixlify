<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixlify - PhotoGallery App</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>


    <div class="container">


        <div class="navbar">

            <div class="logo">
                <a class="pix" href="index.html">Pixlify</a>
            </div>

            <div class="searchBox">
        
                <input id="search" type="text" placeholder="Search Photos">
                <button id="searchBtn">Search</button>
            
            </div>

            <div class="auth-btn">
                <a class="btn" href="login.html">Log in</a>
                <a class="btn" href="register.html">Register</a>
            </div>
        </div>


        <div class="sidebar">


            <button class="side-item">
                  <i data-lucide="compass"></i>
                <span>Explore</span>
            </button>
            <button class="side-item">
                <i data-lucide="bookmark"></i>
                <span>Saved</span>
            </button>
            <button class="side-item">
                 <i data-lucide="user"></i>
                 <span>User</span>
                </button>

            <button class="set" class="side-item">
                <i data-lucide="settings"></i>
                Setting
            </button>
        </div>




        <div class="dashboard">

            
            <div class="categories">
                <button id="natureBtn" class="pics-btn">Nature</button>
                <button id="carBtn" class="pics-btn">Cars</button>
                <button id="travelBtn" class="pics-btn">Travel</button>
            </div>
            
            <h1>Trending images</h1>


            <div id="imageGrid" class="image-grid">
                
        
            </div>

             <button class="moreBtn" id="loadMoreBtn">
                Load More
            </button>


        </div>



    </div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js" integrity="sha512-NcZdtrT77bJr4STcmsGAESr06BYGE8woZdSdEgqnpyqac7sugNO+Tr4bGwGF3MsnEkGKhU2KL2xh6Ec+BqsaHA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="script.js"></script>

</body>

</html>
